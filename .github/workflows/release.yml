name: 构建并发布 APCM MSI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apcm-version-release
  cancel-in-progress: false

jobs:
  release:
    name: 检查版本并发布 x64 MSI
    # Qt msvc2022_64 must use the stable Visual Studio 2022 runner image.
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-cache

    steps:
      - name: 检出代码
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 读取项目版本
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cmake = Get-Content -LiteralPath 'CMakeLists.txt' -Raw
          if ($cmake -notmatch '(?ms)^project\(\s*CertificateManager\s+VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)\b') {
            throw '无法从 CMakeLists.txt 读取 CertificateManager 版本。'
          }

          $version = $Matches[1]
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME 与项目版本 v$version 不一致；请先修改项目版本，再创建对应 Tag。"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "msi=build/package/APCM-$version-x64.msi" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "准备检查 APCM $version。" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: 检查版本是否已经发布
        id: release_check
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $uri = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag"
          $response = Invoke-WebRequest -Uri $uri -Headers $headers -SkipHttpErrorCheck
          if ($response.StatusCode -eq 200) {
            $release = $response.Content | ConvertFrom-Json
            if ($release.draft) {
              throw "$tag 存在未发布草稿，请先检查草稿附件和来源提交，再恢复发布。"
            }
            "should_release=false" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
            "已发布 $tag，本次提交不重复发版。" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          } elseif ($response.StatusCode -eq 404) {
            $remoteTag = git ls-remote --tags origin "refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) { throw "无法查询远程 Tag：$tag" }
            if (-not [string]::IsNullOrWhiteSpace(($remoteTag -join ''))) {
              $tagCommit = git rev-parse "$tag^{commit}"
              if ($LASTEXITCODE -ne 0 -or $tagCommit.Trim() -ne $env:GITHUB_SHA) {
                throw "未发布 Tag $tag 未指向当前构建提交；请先纠正标签，不能发布与源码不一致的 MSI。"
              }
            }
            "should_release=true" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
            "尚未发布 $tag，将构建、测试并发布 MSI。" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          } else {
            throw "查询 Release 失败，HTTP $($response.StatusCode)；不会把权限或网络错误当作尚未发布。"
          }

      - name: 安装 Qt 6.8.3
        if: steps.release_check.outputs.should_release == 'true'
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true

      - name: 恢复 vcpkg 二进制缓存
        id: dependency_cache
        if: steps.release_check.outputs.should_release == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .vcpkg-cache
            .wix
          key: ${{ runner.os }}-vcpkg-x64-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-x64-

      - name: 配置 Windows 构建环境
        if: steps.release_check.outputs.should_release == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path $env:VCPKG_DEFAULT_BINARY_CACHE -Force | Out-Null

          if (-not $env:QT_ROOT_DIR) {
            throw 'Qt 安装 Action 未提供 QT_ROOT_DIR。'
          }
          "QT_ROOT=$env:QT_ROOT_DIR" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkgRoot -and (Test-Path -LiteralPath 'C:\vcpkg\scripts\buildsystems\vcpkg.cmake')) {
            $vcpkgRoot = 'C:\vcpkg'
          }
          if (-not $vcpkgRoot -or
              -not (Test-Path -LiteralPath (Join-Path $vcpkgRoot 'scripts\buildsystems\vcpkg.cmake'))) {
            throw 'GitHub Windows Runner 未提供可用的 vcpkg。'
          }
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 构建、测试并封装 MSI
        if: steps.release_check.outputs.should_release == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\scripts\package.ps1 -Version '${{ steps.version.outputs.version }}'

          $msi = '${{ steps.version.outputs.msi }}'
          if (-not (Test-Path -LiteralPath $msi -PathType Leaf)) {
            throw "封装脚本没有生成预期文件：$msi"
          }

          $fileName = Split-Path -Leaf $msi
          $hash = (Get-FileHash -LiteralPath $msi -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $fileName" | Set-Content -LiteralPath "$msi.sha256" -Encoding ascii
          "已生成 ``$fileName``，SHA-256：``$hash``。" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: 保存依赖缓存
        if: always() && steps.release_check.outputs.should_release == 'true' && steps.dependency_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .vcpkg-cache
            .wix
          key: ${{ steps.dependency_cache.outputs.cache-primary-key }}

      - name: 创建 Tag、上传草稿并发布 GitHub Release
        if: steps.release_check.outputs.should_release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_MSI: ${{ steps.version.outputs.msi }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_VERSION
          $tag = $env:RELEASE_TAG
          $msi = $env:RELEASE_MSI
          $remoteTag = git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}"
          if ($LASTEXITCODE -ne 0) { throw "无法核对远程 Tag：$tag" }
          if ([string]::IsNullOrWhiteSpace(($remoteTag -join ''))) {
            gh api --method POST "repos/$env:GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$env:GITHUB_SHA"
            if ($LASTEXITCODE -ne 0) { throw "无法创建 Tag：$tag" }
          } else {
            $peeled = @($remoteTag | Where-Object { $_ -match '\^\{\}$' })
            $tagLine = if ($peeled.Count -gt 0) { $peeled[0] } else { @($remoteTag)[0] }
            $tagCommit = ($tagLine -split '\s+')[0]
            if ($tagCommit -ne $env:GITHUB_SHA) { throw "远程 $tag 已变化，拒绝发布到其他提交。" }
          }

          $msiAsset = "$msi#APCM $version x64 MSI"
          $checksumAsset = "$msi.sha256#APCM $version SHA-256"
          $notesPath = "docs/releases/$tag.md"
          $notesArguments = if (Test-Path -LiteralPath $notesPath) { @('--notes-file', $notesPath) } else { @('--generate-notes') }
          gh release create $tag $msiAsset $checksumAsset --verify-tag --draft --title "APCM $version" @notesArguments
          if ($LASTEXITCODE -ne 0) { throw "创建 Release 草稿失败：$tag" }

          $details = gh release view $tag --json isDraft,assets
          if ($LASTEXITCODE -ne 0) { throw "无法核对 Release 草稿：$tag" }
          $release = $details | ConvertFrom-Json
          $expectedNames = @((Split-Path -Leaf $msi), "$(Split-Path -Leaf $msi).sha256")
          $actualNames = @($release.assets | ForEach-Object { $_.name })
          if (-not $release.isDraft -or $actualNames.Count -ne 2 -or
              @(Compare-Object $expectedNames $actualNames).Count -ne 0 -or
              @($release.assets | Where-Object { $_.state -ne 'uploaded' -or $_.size -le 0 }).Count -gt 0) {
            throw 'Release 草稿附件不完整，保留草稿供恢复，不提前发布。'
          }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "发布 Release 失败：$tag" }
          "已发布 Release ``$tag``，包含 MSI 和 SHA-256 校验文件。" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
